[project]
name = "ww-teetime"
version = "0.1.0"
description = "Automated tee time monitoring and booking agents for Westwood Golf Club"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["config*", "agents*", "models*", "browser*"]

[project.scripts]
ww-teetime = "main:main"
